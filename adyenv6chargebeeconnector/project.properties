adyenv6chargebeeconnector.application-context=adyenv6chargebeeconnector-spring.xml

# --- Chargebee connector configuration ---
# There is none here any more. Site, API key, gateway account id, the webhook Basic Auth credentials
# and the Adyen merchant account used by the gateway-binding check all live on the base store
# (Backoffice: Adyen Configuration > Chargebee Config).
# The former chargebee.* credential properties were removed rather than deprecated: left in place
# they read as configuration that still works, and nothing would have reported that they are ignored.

# --- Transport tuning (stays here: per installation, not per store) ---
# Time to establish the connection.
chargebee.http.connectTimeoutMillis=5000
# Time to wait for Chargebee's response. httpclient5 has NO default here, so without this value a
# call that connects and then hangs holds a platform worker thread forever.
chargebee.http.responseTimeoutMillis=30000
# How long a caller may queue for a pooled connection. Left at the httpclient default it would be
# three minutes, which silently overrides the two timeouts above as the real worst case.
chargebee.http.connectionRequestTimeoutMillis=5000
# Pool size, total and per route: all traffic goes to the one Chargebee host, and the library default
# of 2 per route would serialize the whole platform onto two connections.
chargebee.http.maxConnections=20
