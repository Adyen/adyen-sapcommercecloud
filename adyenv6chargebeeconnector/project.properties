adyenv6chargebeeconnector.application-context=adyenv6chargebeeconnector-spring.xml

# --- Chargebee connector configuration (override in local.properties) ---
# Chargebee site subdomain -> https://<site>.chargebee.com/api/v2
chargebee.site=
# Chargebee full-access API key (used as HTTP Basic username, empty password)
chargebee.apiKey=
# The Adyen gateway account id configured inside Chargebee (payment routing)
chargebee.gatewayAccountId=
# The Adyen merchant account that Chargebee's Adyen gateway is bound to (R2 check)
chargebee.adyenMerchantAccount=
