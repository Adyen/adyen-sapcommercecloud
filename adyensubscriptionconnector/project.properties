
# Specifies the location of the spring context file put automatically to the
# global platform application context.
adyensubscriptionconnector.application-context=adyensubscriptionconnector-spring.xml

# ---------------------------------------------------------------------------
# Retry policy for failed subscription activations and webhook deliveries.
#
# The defaults give up after five attempts spread over roughly an hour and a
# half: 1m, 4m, 16m, 64m. Deliberately unhurried — the failure this exists for
# is a billing platform being down, and retrying hard into an outage extends
# it. Raise maxAttempts before shortening the backoff.
# ---------------------------------------------------------------------------
adyen.subscription.retry.maxAttempts=5
adyen.subscription.retry.initialBackoffSeconds=60
adyen.subscription.retry.backoffMultiplier=4.0
# Ceiling on any single wait, so a longer schedule cannot stretch into days.
adyen.subscription.retry.maxBackoffSeconds=21600

# How many due activations one run of the retry job takes on. The rest wait for
# the next run rather than one run holding a worker for an unbounded time.
adyen.subscription.retry.job.batchSize=100

# After this long, an activation still marked PENDING is treated as abandoned
# by a thread that never came back (node killed mid-call) and is retried. Must
# comfortably exceed the slowest realistic activation, or a slow call will be
# picked up a second time while the first is still running.
adyen.subscription.retry.job.stalePendingAfterSeconds=1800

# Periodic source-of-truth reconciliation. Keep the batch below platform read-rate limits.
adyen.subscription.reconciliation.staleAfterMinutes=60
adyen.subscription.reconciliation.batchSize=100

# How long after its term ended an EXPIRED subscription is still re-read, so that a reactivation whose
# webhook was lost is still repaired. 0 keeps only terms that have not actually run out yet.
adyen.subscription.reconciliation.expiredWindowHours=168

# --- Retention for the billing journals -------------------------------------
# Nothing removed these rows before. Every delivery and every activation leaves one, lastError is long
# text, and a failed delivery now also keeps the body the platform sent — so on a store that sells
# subscriptions both tables only ever grow.
#
# Two windows on purpose. A quiet success is bookkeeping and goes early; anything carrying an error or a
# dead-letter stamp is evidence and stays far longer, because a dead letter means a shopper paid and got
# nothing, and the platform's own delivery log ages out on a schedule we do not control.
#
# Rows that are still actionable are never removed at any age: a PENDING or FAILED activation belongs to
# the retry job's queue, and an unsettled delivery may still be redelivered.
adyen.subscription.retention.settledAfterDays=30
adyen.subscription.retention.troubledAfterDays=180
# Per run, per journal. Deliberately modest: this competes with live traffic and has all day to catch up.
adyen.subscription.retention.job.batchSize=500
