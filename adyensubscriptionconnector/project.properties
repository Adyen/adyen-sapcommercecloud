
# Specifies the location of the spring context file put automatically to the
# global platform application context.
adyensubscriptionconnector.application-context=adyensubscriptionconnector-spring.xml

# ---------------------------------------------------------------------------
# Retry policy for failed subscription activations and webhook deliveries.
#
# The defaults give up after five attempts spread over roughly an hour and a
# half: 1m, 4m, 16m, 64m. Deliberately unhurried — the failure this exists for
# is a billing platform being down, and retrying hard into an outage extends
# it. Raise maxAttempts before shortening the backoff.
# ---------------------------------------------------------------------------
adyen.subscription.retry.maxAttempts=5
adyen.subscription.retry.initialBackoffSeconds=60
adyen.subscription.retry.backoffMultiplier=4.0
# Ceiling on any single wait, so a longer schedule cannot stretch into days.
adyen.subscription.retry.maxBackoffSeconds=21600

# How many due activations one run of the retry job takes on. The rest wait for
# the next run rather than one run holding a worker for an unbounded time.
adyen.subscription.retry.job.batchSize=100

# After this long, an activation still marked PENDING is treated as abandoned
# by a thread that never came back (node killed mid-call) and is retried. Must
# comfortably exceed the slowest realistic activation, or a slow call will be
# picked up a second time while the first is still running.
adyen.subscription.retry.job.stalePendingAfterSeconds=1800
