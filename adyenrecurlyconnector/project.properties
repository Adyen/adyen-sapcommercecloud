adyenrecurlyconnector.application-context=adyenrecurlyconnector-spring.xml

# --- Recurly connector configuration (override in local.properties) ---
#
# Credentials and per-site switches are NOT here. Site/base URL, API key, gateway code, the webhook
# signing key, the Adyen gateway merchant account for the R2 check, and the walletEnabled /
# externalNtidFeatureEnabled switches all live on the base store (Backoffice: Adyen Configuration >
# Recurly Config). The keys that used to carry them were removed rather than deprecated: left in
# place they read as configuration that still works, and nothing would report that they are ignored.
#
# What remains is transport tuning that is the same for every store.
#
# Recurly API version used in vendor media type headers
recurly.apiVersion=v2021-02-25
# Delay used when the connector receives no explicit start date. Recurly's external-NTID
# flow requires a future start; five minutes also allows for clock skew between systems.
recurly.minimumStartDelaySeconds=300
# Transport timeouts. Keep platform worker threads bounded during network failures.
recurly.http.connectTimeoutMillis=5000
recurly.http.responseTimeoutMillis=30000
# How long a caller may queue for a pooled connection. Left at the httpclient default it would be three
# minutes, which silently overrides the two timeouts above as the real worst case.
recurly.http.connectionRequestTimeoutMillis=5000
# Pool size, total and per route: all traffic goes to the one Recurly host.
recurly.http.maxConnections=20
# Maximum accepted age/future skew of a signed webhook.
recurly.webhookToleranceSeconds=300
