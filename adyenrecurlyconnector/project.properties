# adyenrecurlyconnector.key=value

# Specifies the location of the spring context file putted automatically to the global platform application context.
adyenrecurlyconnector.application-context=adyenrecurlyconnector-spring.xml

# you can control your logger as follows:
log4j2.logger.helloController.name = com.adyen.commerce.connector.recurly.service.impl.DefaultAdyenrecurlyconnectorService
log4j2.logger.helloController.level = DEBUG
log4j2.logger.helloController.appenderRef.stdout.ref = STDOUT

#uncomment, if you want to customize the tld/pluggability scanning. You can extend the allowlists below if there is need for that
#adyenrecurlyconnector.tomcat.tld.scan=jakarta.servlet.jsp.jstl-*.jar
#adyenrecurlyconnector.tomcat.tld.default.scan.enabled=false
#adyenrecurlyconnector.tomcat.pluggability.scan=jakarta.servlet.jsp.jstl-*.jar
#adyenrecurlyconnector.tomcat.pluggability.default.scan.enabled=false

# Default configuration that adds Content Security Policy response header to web application in the "adyenrecurlyconnector" extension
# to enhance the security.
# Note : In order to configure own Content Security Policy use following pattern :
# policy-directive value1 value2 ... value_n
# Use semicolons to separate policy directives.
adyenrecurlyconnector.xss.filter.header.Content-Security-Policy=default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'self' 'unsafe-inline'

recurly.apiKey=
recurly.baseUrl=
