adyenrecurlyconnector.application-context=adyenrecurlyconnector-spring.xml

# --- Recurly connector configuration (override in local.properties) ---
# Recurly v3 API base URL, e.g. https://v3.recurly.com
recurly.baseUrl=https://v3.eu.recurly.com
# Recurly private API key (used as HTTP Basic username, empty password)
recurly.apiKey=
# Recurly API version used in vendor media type headers
recurly.apiVersion=v2021-02-25
# The Recurly gateway code for the Adyen gateway configuration
recurly.gatewayCode=
# The Adyen merchant account that Recurly's Adyen gateway is bound to (R2 check)
recurly.adyenMerchantAccount=
# Delay used when the connector receives no explicit start date. Recurly's external-NTID
# flow requires a future start; five minutes also allows for clock skew between systems.
recurly.minimumStartDelaySeconds=300
# Transport timeouts. Keep platform worker threads bounded during network failures.
recurly.http.connectTimeoutMillis=5000
recurly.http.responseTimeoutMillis=30000
# How long a caller may queue for a pooled connection. Left at the httpclient default it would be three
# minutes, which silently overrides the two timeouts above as the real worst case.
recurly.http.connectionRequestTimeoutMillis=5000
# Pool size, total and per route: all traffic goes to the one Recurly host.
recurly.http.maxConnections=20
# Signing secret from the Recurly JSON webhook endpoint configuration.
recurly.webhookSigningKey=
# Maximum accepted age/future skew of a signed webhook.
recurly.webhookToleranceSeconds=300
# Recurly Support must enable "Allow NTIDs in APIs" and "Enables Backfilling External Tokens".
# Keep false until both flags are confirmed for the site; this is a self-attestation, not a probe, so
# shipping it true means the precondition that names those two flags never fires and an operator whose
# site lacks them gets a raw Recurly API error instead.
recurly.externalNtidFeatureEnabled=false
# Optional mode switch. False uses the account's single primary billing info and omits subscription-level
# billing_info_id; true uses Subscriber Wallet and pins the imported billing info to the subscription.
recurly.walletEnabled=false
