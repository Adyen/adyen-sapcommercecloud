type.RecurlyConfig.hostedPagesHost.name=Hosted Pages Host
type.RecurlyConfig.hostedPagesHost.description=Host of this site's Recurly hosted pages, without scheme or path, e.g. mystore.recurly.com. Copy it from the Account Management URL in the Recurly admin.
type.RecurlyConfig.hostedAccountManagementEnabled.name=Hosted Account Management Enabled
type.RecurlyConfig.hostedAccountManagementEnabled.description=Offers shoppers a link to Recurly's hosted account management page. Needs Hosted Account Management on in the Recurly admin and Hosted Pages Host set.
