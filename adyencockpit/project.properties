adyencockpit.application-context=adyencockpit-spring.xml

# Path the cockpit SPA is served from, inside the backoffice webapp. Changing it means changing
# the servlet mapping and the filter mapping in resources/web-fragment.xml to match.
adyencockpit.webapp.path=/adyencockpit

# Set to true to assemble the fragment from resources/webapp instead of building the Angular app.
# The build falls back to that anyway when no Angular output is present.
adyencockpit.spa.build.skip=false

# Where adyenv6notificationv2 receives a site's notifications, relative to the public base URL Adyen
# posts to. {site} is replaced by the base site uid. Keep the webapp context: without it the URL is a 404.
adyencockpit.notification.path=/adyenv6notificationv2/adyen/v6/notification/{site}/json

# Management API endpoint for every store. Leave unset: each store then uses the test or live
# environment its Adyen test mode names, and keys do not cross between the two.
#adyencockpit.management.api.endpoint=https://management-test.adyen.com/v3
