# you can put key/value pairs here.
# Use Config.getParameter(..) to retrieve the values during runtime.

# adyenv6core.key=value

# Specifies the location of the spring context file putted automatically to the global platform application context.
adyenv6core.application-context=adyenv6core-spring.xml

# Essential data for installment configurations
adyenv6core.essentialdata-adyen-installments=/impex/essentialdata-adyen-installments.impex

adyen.notification.chargeback.tickets.enabled=true
#value from CsTicketPriority
adyen.notification.chargeback.tickets.priority=Medium
#value from CsTicketCategory
adyen.notification.chargeback.tickets.category=Problem
adyen.notification.chargeback.tickets.agentGroup=adyenChargebackAgentGroup

# Voucher payments (Konbini, Boleto, Multibanco; resultCode PresentToShopper): how long the order process keeps
# waiting for the late AUTHORISATION webhook before the order is set to PROCESSING_ERROR.
# Both values are ISO-8601 durations (java.time.Duration); an invalid value falls back to the default.
# Grace period added to the voucher expiry (adyenVoucherExpiresAt) stored on the order.
adyen.voucher.pending.grace.period=PT6H
# Maximum wait counted from order creation, used when the voucher expiry is unknown.
adyen.voucher.pending.fallback.max.wait=P3D
# Upper cap counted from order creation, so a bogus far-future voucher expiry cannot keep the process waiting forever.
adyen.voucher.pending.max.wait=P30D
