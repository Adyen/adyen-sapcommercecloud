# -----------------------------------------------------------------------
# My Account: subscriptions.
#
# These live here rather than in resources/localization because <spring:theme> reads the storefront's
# message source, which addoninstall assembles from WEB-INF/messages. A key placed in the other file
# renders as ???text.account.subscriptions??? on the page.
#
# Two keys per state where a date can be known: the plain one, and a ".dated" one taking the date as {0}.
# The period end is not known until the first reconciliation, so every sentence needs a version that
# promises no date.
#
# APOSTROPHES. Write ' in a message that takes no arguments and '' in one that does. Spring runs a message
# through MessageFormat only when arguments are passed (alwaysUseMessageFormat is false by default), and
# only MessageFormat treats '' as an escaped apostrophe, so '' in an argument-less message reaches the
# shopper verbatim. The keys that take arguments, and therefore the only ones that double the apostrophe:
#   .awaitingSetup, .order, .orderNumber, .paidWith, and every state.*.dated
# -----------------------------------------------------------------------

text.account.subscriptions=Subscriptions
text.account.subscriptions.empty=You don't have any subscriptions.
text.account.subscriptions.unnamed=Subscription
# {0} is the date, not the order number.
text.account.subscriptions.order=Ordered on {0}
text.account.subscriptions.orderNumber=Order {0}
text.account.subscriptions.paidWith=Paid with {0}

# The shopper paid and the subscription was never created. Names the order so they have something to quote,
# and promises nothing about being contacted, because nothing in the system sends that message.
# One block with a line per order, not one block per order.
text.account.subscriptions.awaitingSetup.title=We couldn't set these up
text.account.subscriptions.awaitingSetup=Order {0}: we''ve taken your payment but haven''t been able to set \
  your subscription up yet. Please contact us with this order number.

text.account.subscriptions.state.setting_up=We're still setting this up with our billing provider.
text.account.subscriptions.state.setting_up.dated=We''re still setting this up with our billing provider.
text.account.subscriptions.state.active=Active.
text.account.subscriptions.state.active.dated=Active. Renews on {0}.
text.account.subscriptions.state.starting_soon=Starting soon.
text.account.subscriptions.state.starting_soon.dated=Starts on {0}.
text.account.subscriptions.state.ending=Active. Won't renew.
text.account.subscriptions.state.ending.dated=Won''t renew. You have access until {0}.
text.account.subscriptions.state.paused=Paused. Please contact us to resume it.
text.account.subscriptions.state.paused.dated=Paused. Please contact us to resume it.
text.account.subscriptions.state.past_due=We couldn't take the last payment. Your provider will try again.
text.account.subscriptions.state.past_due.dated=We couldn''t take the last payment. Your provider will try \
  again before {0}.
text.account.subscriptions.state.past_due_ending=Won't renew, and there's an unpaid invoice. Please contact us.
text.account.subscriptions.state.past_due_ending.dated=Won''t renew, and there''s an unpaid invoice. Please \
  contact us before {0}.
text.account.subscriptions.state.ended=Ended.
text.account.subscriptions.state.ended.dated=Ended on {0}.
text.account.subscriptions.state.unavailable=We can't show the status of this subscription right now. \
  Please contact us.
text.account.subscriptions.state.unavailable.dated=We can''t show the status of this subscription right now. \
  Please contact us.

text.account.subscriptions.cancel=Cancel renewal
# Cancelling always takes effect at the end of the period, and neither billing platform is sent a refund
# instruction.
text.account.subscriptions.cancel.note=You'll keep access until the end of the period you've paid for. \
  No refund is issued for the current period.
text.account.subscriptions.cancel.success=Your subscription won't renew. You keep access until the end of \
  the period you've paid for.
text.account.subscriptions.cancel.error=We couldn't cancel that subscription. Please try again, or contact \
  us if it keeps happening.

# Pointing billing at another already-stored card.
#
# Two of everything, keyed by the SCOPE the connector declares rather than by the platform's name: a change
# that moves every subscription and one that moves a single subscription are different promises. The scope
# arrives as a server-side enum and the key is composed from it, the same idiom the state sentences use.
text.account.subscriptions.paymentMethod=Change the card you pay with
text.account.subscriptions.paymentMethod.note.CUSTOMER=This card will be used for every subscription \
  billed by the same provider. Any subscription shown below as unchangeable is not affected. Only cards you \
  have already saved can be chosen here.
text.account.subscriptions.paymentMethod.note.SUBSCRIPTION=This will be used for this subscription only; \
  your other subscriptions are not affected. You can choose from the payment methods your billing provider \
  already holds - which may be fewer than the cards saved in your account.
# The label over the card picker. Used by both the control above the list and the in-row one.
text.account.subscriptions.paymentMethod.choose=Choose a saved card
text.account.subscriptions.paymentMethod.submit=Use this card
text.account.subscriptions.paymentMethod.success.customer=Every subscription billed by that provider will \
  now be charged to the card you chose.
text.account.subscriptions.paymentMethod.success.subscription=This subscription will now be billed to the \
  payment method you chose. Your other subscriptions are unchanged.
text.account.subscriptions.paymentMethod.error=We couldn't change the card. Please try again, or contact us \
  if it keeps happening.
# Not an error and not an invitation to retry: the billing provider cannot do it at all, so the shopper is
# pointed at the only route that exists.
text.account.subscriptions.paymentMethod.unsupported=We can't change the card for these subscriptions \
  online. Please contact us and we'll do it for you.

# In-row wording, for platforms that pin the payment method to one subscription. The control sits next to
# the subscription it affects, so the sentence does not have to warn about the others. It says "payment
# method" and not "card" because the picker lists whatever the billing provider holds, which may be a PayPal
# agreement or a bank account.
# The row picker lists what the billing provider holds, which need not be cards, and a provider that
# reports no card detail leaves several entries reading alike - so the one it bills by default is marked.
text.account.subscriptions.paymentMethod.choose.row=Choose a payment method your provider holds
text.account.subscriptions.paymentMethod.default=(currently used)
text.account.subscriptions.paymentMethod.row=Change how this subscription is paid for
text.account.subscriptions.paymentMethod.row.submit=Use this payment method
# Said only on a row the page singles out: the change is offered elsewhere, this row is in a state where it
# would matter, and it still cannot be done here.
text.account.subscriptions.paymentMethod.row.unavailable=The card for this subscription can't be changed \
  online. Please contact us and we'll do it for you.

text.account.subscriptions.paymentMethod.add=Add a card with your provider
text.account.subscriptions.paymentMethod.add.submit=Go to your provider
# One per PaymentMethodEnrollmentEffect. The replacing variant says so plainly: the shopper is about to
# overwrite the card their provider holds, and cannot find that out after the fact.
text.account.subscriptions.paymentMethod.add.effect.ADDS_METHOD=Your provider will take the card details on \
  their own page. Come back here afterwards to choose which subscription uses it.
text.account.subscriptions.paymentMethod.add.effect.REPLACES_METHOD_ON_FILE=Your provider will take the card \
  details on their own page, replacing the card they hold for you. Subscriptions already set to a specific \
  card keep it. Come back here afterwards to choose which subscription uses the new one.
text.account.subscriptions.paymentMethod.add.unavailable=We can't open your provider's payment page right \
  now. Please try again later.

text.account.subscriptions.paymentMethod.group.platform=Held by your provider
text.account.subscriptions.paymentMethod.group.vault=Your saved cards
